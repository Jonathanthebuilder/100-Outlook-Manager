<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的常用工具集</title>
    <style>
      :root {
        color: #182026;
        background: #f4f6f8;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, #f8fafb 0%, #eef2f5 100%);
      }

      main {
        width: min(980px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      header {
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 5vw, 48px);
        line-height: 1.08;
      }

      p {
        margin: 10px 0 0;
        color: #607080;
        line-height: 1.7;
      }

      .tool-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 14px;
      }

      .tool-card {
        display: grid;
        gap: 16px;
        min-height: 210px;
        padding: 22px;
        border: 1px solid #dbe3ea;
        border-radius: 8px;
        background: #ffffff;
        color: inherit;
        text-decoration: none;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          box-shadow 160ms ease;
      }

      .tool-card:hover {
        transform: translateY(-2px);
        border-color: #a9bac8;
        box-shadow: 0 16px 34px rgba(20, 35, 48, 0.1);
      }

      .tool-icon {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 8px;
        background: #edf4ff;
        color: #2364d2;
        font-size: 26px;
        font-weight: 800;
      }

      .tool-card h2 {
        margin: 0;
        font-size: 22px;
      }

      .tool-card span {
        align-self: end;
        color: #2364d2;
        font-size: 14px;
        font-weight: 760;
      }

      .note {
        margin-top: 18px;
        padding: 14px 16px;
        border: 1px solid #dbe3ea;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.72);
        color: #617181;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>我的常用工具集</h1>
        <p>这里放你常用的本地小工具。点击工具卡片即可打开，不需要启动 npm 服务，也不会占用本机端口。</p>
      </header>

      <section class="tool-grid" aria-label="工具列表">
        <a class="tool-card" href="file:///Users/jonathan/Codex/Outlook-Manager/dist/outlook-manager-standalone.html" target="_blank" rel="noreferrer">
          <div class="tool-icon">O</div>
          <div>
            <h2>Outlook Manager</h2>
            <p>导入 TXT、抽取邮箱、备注归属、导出有效库存。</p>
          </div>
          <span>打开工具</span>
        </a>
      </section>

      <p class="note">提示：Outlook Manager 是离线静态页面。关闭浏览器标签页即可，不会留下后台服务。</p>
    </main>
  </body>
</html>
